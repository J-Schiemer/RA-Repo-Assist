[project]
name = "ra"
version = "0.1.0"
description = "A command line tool that generates markdown overviews of repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
ra = "ra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra"]
